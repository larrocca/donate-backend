spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:donate;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.docker.compose.enabled=false

auth0.domain=test.example.com
auth0.client-id=test-client
auth0.audience=donate
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${auth0.domain}/
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}

nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=DonateApp/1.0 (contact: donate-test@localhost)
nominatim.max-results=5
nominatim.connect-timeout-ms=5000
nominatim.read-timeout-ms=10000
