spring.application.name=donate
spring.profiles.active=local

# Auth0
auth0.domain=dev-njzfy2r5ryn8mnpt.us.auth0.com
auth0.client-id=ZlYTdPZzhbZset4swCnOPhnNrv585PRV
auth0.audience=donate

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${auth0.domain}/
spring.security.oauth2.resourceserver.jwt.audiences=${auth0.audience}

# MySQL local - base "donate"
# Si usás otro usuario/password, activá el perfil local:
#   -Dspring.profiles.active=local  (ver application-local.properties.example)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:donate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:donate}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Sin Docker en local
spring.docker.compose.enabled=false

# Nominatim (OpenStreetMap) — requires a REAL contact email (blocks @example.com)
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=DonateApp/1.0 (contact: ${NOMINATIM_CONTACT_EMAIL})
nominatim.max-results=5
nominatim.connect-timeout-ms=5000
nominatim.read-timeout-ms=10000
